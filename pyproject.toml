[project]
name = "librelane"
version = "3.1.0.dev6"
description = "An infrastructure for implementing chip design flows"
maintainers = [
    {name = "Mohamed Gaber", email = "donn@fossi-foundation.org"},
    {name = "Leo Moser", email = "leo@fossi-foundation.org"}
]
readme = "Readme.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "click>=8,<8.4",
  "cloup>=3.0.5,<4",
  "pyyaml>=5,<7",
  "rich>=12,<16",
  "ciel>=3.2.0,<4",
  "lxml>=4.9.0",
  "deprecated>=1.2.10,<2",
  "lln-libparse==0.70.*",
  "psutil>=5.9.0",
  "httpx>=0.22.0,<0.29",
  "rapidfuzz>=3.9.0,<4",
  "yamlcore>=0.0.2,<0.1.0",
  "semver>=3.0.2,<4"
]

[project.optional-dependencies]
tools = [
  "pyosys==0.70.*",
  "klayout>=0.30.12,<0.32.0",
  "lln-openroad==26.4.*",
  "magic-vlsi @ git+https://github.com/donn/magic@py3_none_wheel",
  "netgen @ git+https://github.com/donn/netgen@py3_none_wheel"
]

[project.urls]
homepage = "https://librelane.org/"
repository = "https://github.com/librelane/librelane"
documentation = "https://librelane.readthedocs.io"
"Bug Tracker" = "https://github.com/librelane/librelane/issues"

[dependency-groups]
lint = [
    "black<26",
    "flake8",
    "flake8-pytest-style; python_version < '4'",
    "mypy>=1.18.2,<2",
    "lxml-stubs",
    "types-urllib3",
    "types-typed-ast",
    "types-six",
    "types-setuptools",
    "types-PyYAML",
    "types-docutils",
    "types-decorator",
    "types-commonmark",
    "types-colorama",
    "types-Pygments",
    "types-Deprecated",
    "types-psutil",
]
test = [
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "pyfakefs",
    "pillow"
]

[project.scripts]
librelane = "librelane.__main__:cli"
"librelane.steps" = "librelane.steps.__main__:cli"
"librelane.config" = "librelane.config.__main__:cli"
"librelane.state" = "librelane.state.__main__:cli"
"librelane.help" = "librelane.help.__main__:cli"
"librelane.env_info" = "librelane:env_info_cli"

[tool.ruff]
target-version = "py310"
include = ["librelane/scripts/*.py"]

[tool.ruff.lint]
extend-select = ["I", "PL", "UP"]
ignore = [
    # Annoying refactor suggestions
    "PLR",
    # mutable class variables - this one is kinda valid but there's no way
    # to fix it without destroying ergonomics
    "RUF012",
    # bare except
    "BLE001",
    # try-except-pass
    "S110"
]

[tool.ruff.lint.isort]
case-sensitive = true
known-first-party = ["reader", "ys_common", "construct_abc_script", "librelane"]

[tool.ruff.lint.per-file-ignores]
"librelane/env_info.py" = ["UP"]
"librelane/scripts/klayout/*.py" = []

[tool.black]
extend-exclude = "(test/designs|test/steps/all)"

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--strict-markers -m 'not step_impl_test'"
markers = [
    "all: all tests",
    "step_impl_test: tests for specific step implementations (requires recursive git clone + more time)",
]
norecursedirs = ["test/designs"]

[build-system]
requires = ["poetry-core>=2.0.0,<3"]
build-backend = "poetry.core.masonry.api"
